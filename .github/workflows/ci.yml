# Integração contínua mínima (Fase 1.4.1).
#
# Corre exatamente os comandos que o projeto já define em package.json, na
# mesma ordem em que um humano os correria. Nada aqui é específico do CI: se
# algum passo falhar, falha igual na máquina de quem desenvolve.
#
# O passo `npm test` inclui `tests/canonical-baseline.test.ts`, que compara o
# SHA-256 do GDD e do Plano de Ação com `docs/canonical-hashes.json`. É o que
# torna as AGENT_RULES verificáveis em vez de voluntárias: qualquer alteração
# silenciosa de um documento canônico passa a quebrar o envio.

name: CI

on:
  push:
  pull_request:

jobs:
  verificacao:
    name: testes, tipos e construção
    runs-on: ubuntu-latest

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5

      - name: Preparar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências travadas
        run: npm ci

      - name: Testes
        run: npm test

      - name: Checagem de tipos e construção
        run: npm run build

      - name: Comando de simulação
        run: npm run simulate

  # Job separado de proposito. Uma falha de navegador nunca deve disfarcar-se de
  # falha de unidade, e o conjunto acima continua a responder em segundos mesmo
  # quando este demora minutos.
  imagem:
    name: imagem em navegador real
    runs-on: ubuntu-latest

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5

      - name: Preparar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências travadas
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de imagem
        run: npm run test:browser

      # Sem publicacao de relatorio. Nao ha imagem de referencia guardada, entao
      # um relatorio traria pouco alem do que o registo ja mostra — e uma falha
      # aqui reproduz-se na maquina de quem desenvolve com `npm run test:browser`,
      # que e a mesma regra do resto deste CI.
